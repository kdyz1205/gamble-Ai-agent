<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#F7FBFF;color:#111827;}
.screen{width:1440px;height:900px;overflow:hidden;position:relative;padding:36px 44px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:950;letter-spacing:.16em;text-transform:uppercase;font-size:12px}.logo{width:38px;height:38px;border-radius:13px;background:#34D399;color:#07110C;display:grid;place-items:center;font-weight:1000}.tag{font-size:12px;color:#64748B;font-weight:800}.pill{border:1px solid rgba(148, 163, 184, .26);border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.72);font-weight:850}
h1{font-size:58px;letter-spacing:-.052em;line-height:.96;margin:0}.thesis{font-size:18px;line-height:1.45;color:#64748B;font-weight:700;max-width:760px;margin:12px 0 0}
.glass{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);box-shadow:0 28px 90px rgba(15,23,42,.10);backdrop-filter:blur(22px)}.card{border:1px solid rgba(148, 163, 184, .26);background:#fff;border-radius:24px;box-shadow:0 20px 70px rgba(15,23,42,.08)}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#059669;font-weight:950}.muted{color:#64748B}.btn{border:0;border-radius:999px;background:#34D399;color:#052E1A;padding:13px 20px;font-weight:950}.btn2{border:1px solid rgba(148, 163, 184, .26);border-radius:999px;background:#fff;color:#111827;padding:12px 18px;font-weight:900}

</style></head><body><main class="screen"><div class="top"><div class="brand"><div class="logo">A</div><span>StepOne</span></div><div class="tag">07 Bento Home</div></div>
<section style="display:grid;grid-template-columns:1.1fr .9fr;gap:18px;height:760px">
  <div class="card" style="padding:28px;display:flex;flex-direction:column;justify-content:space-between">
    <div><h1>Start a challenge.</h1><p class="thesis">One sentence creates a playable protocol.</p></div>
    <div class="glass" style="border-radius:26px;padding:18px"><div style="font-size:24px;font-weight:800;color:#64748B;height:110px">I bet Jerry...</div><div style="display:flex;justify-content:space-between"><span class="pill">DeepSeek V4</span><button class="btn">Send</button></div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
    <div class="card" style="padding:24px"><div class="label">Credits</div><h2 style="font-size:48px;margin:18px 0 8px">43 pts</h2><p class="muted" style="font-weight:800">Daily AI budget ready</p></div>
    <div class="card" style="padding:24px"><div class="label">Pending</div><h2 style="font-size:48px;margin:18px 0 8px">2</h2><p class="muted" style="font-weight:800">Need evidence</p></div>
    <div class="card" style="padding:24px"><div class="label">Nearby</div><h2 style="font-size:48px;margin:18px 0 8px">7</h2><p class="muted" style="font-weight:800">Open rooms</p></div>
    <div class="card" style="padding:24px"><div class="label">Reviews</div><h2 style="font-size:48px;margin:18px 0 8px">1</h2><p class="muted" style="font-weight:800">AI unsure</p></div>
  </div>
</section><div style="position:absolute;right:38px;bottom:24px;color:#94A3B8;font-size:12px;font-weight:800">All important states visible without becoming admin UI.</div></main></body></html>
