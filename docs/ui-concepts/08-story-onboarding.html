<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#0F172A,#10251D);color:#fff;}
.screen{width:1440px;height:900px;overflow:hidden;position:relative;padding:36px 44px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:950;letter-spacing:.16em;text-transform:uppercase;font-size:12px}.logo{width:38px;height:38px;border-radius:13px;background:#34D399;color:#07110C;display:grid;place-items:center;font-weight:1000}.tag{font-size:12px;color:#64748B;font-weight:800}.pill{border:1px solid rgba(148, 163, 184, .26);border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.72);font-weight:850}

</style></head><body><main class="screen"><div class="top"><div class="brand"><div class="logo">A</div><span>StepOne</span></div><div class="tag">08 Story Onboarding</div></div>
<section style="height:760px;display:grid;place-items:center">
  <div style="width:430px;height:760px;border-radius:48px;background:#050B12;border:10px solid rgba(255,255,255,.12);padding:28px;box-shadow:0 40px 120px rgba(0,0,0,.35)">
    <div style="height:100%;border-radius:34px;background:linear-gradient(180deg,rgba(52,211,153,.18),rgba(56,189,248,.08));padding:26px;display:flex;flex-direction:column;justify-content:space-between">
      <div><div class="label">Story 1 / 3</div><h1 style="font-size:48px">Say it.</h1><p style="font-size:18px;line-height:1.45;color:#CBD5E1;font-weight:700">“Who can do more push-ups?”</p></div>
      <div><div style="height:8px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden"><div style="width:33%;height:100%;background:#34D399"></div></div><button class="btn" style="width:100%;margin-top:18px">Start</button></div>
    </div>
  </div>
</section><div style="position:absolute;right:38px;bottom:24px;color:#94A3B8;font-size:12px;font-weight:800">Consumer first-run with almost no explanation.</div></main></body></html>
