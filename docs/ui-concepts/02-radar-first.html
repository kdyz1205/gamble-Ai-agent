<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#ECFDF5;color:#111827;}
.screen{width:1440px;height:900px;overflow:hidden;position:relative;padding:36px 44px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:950;letter-spacing:.16em;text-transform:uppercase;font-size:12px}.logo{width:38px;height:38px;border-radius:13px;background:#34D399;color:#07110C;display:grid;place-items:center;font-weight:1000}.tag{font-size:12px;color:#64748B;font-weight:800}.pill{border:1px solid rgba(148, 163, 184, .26);border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.72);font-weight:850}
h1{font-size:58px;letter-spacing:-.052em;line-height:.96;margin:0}.thesis{font-size:18px;line-height:1.45;color:#64748B;font-weight:700;max-width:760px;margin:12px 0 0}
.glass{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);box-shadow:0 28px 90px rgba(15,23,42,.10);backdrop-filter:blur(22px)}.card{border:1px solid rgba(148, 163, 184, .26);background:#fff;border-radius:24px;box-shadow:0 20px 70px rgba(15,23,42,.08)}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#059669;font-weight:950}.muted{color:#64748B}.btn{border:0;border-radius:999px;background:#34D399;color:#052E1A;padding:13px 20px;font-weight:950}.btn2{border:1px solid rgba(148, 163, 184, .26);border-radius:999px;background:#fff;color:#111827;padding:12px 18px;font-weight:900}

</style></head><body><main class="screen"><div class="top"><div class="brand"><div class="logo">A</div><span>stubborn</span></div><div class="tag">02 Radar First</div></div>
<section style="display:grid;grid-template-columns:470px 1fr;gap:28px;height:760px">
  <aside class="glass" style="border-radius:32px;padding:26px">
    <h1 style="font-size:52px">Nearby challenges.</h1>
    <p class="thesis">Open app, allow location, join what is around you, or create one here.</p>
    <div style="margin-top:30px;display:grid;gap:14px">
      <div class="card" style="padding:16px"><b>KTV water sprint</b><div class="muted" style="font-weight:800;margin-top:5px">0.2 mi / same camera</div></div>
      <div class="card" style="padding:16px"><b>Park plank hold</b><div class="muted" style="font-weight:800;margin-top:5px">0.6 mi / video</div></div>
      <div class="card" style="padding:16px"><b>Coffee trivia</b><div class="muted" style="font-weight:800;margin-top:5px">1.1 mi / text</div></div>
    </div>
    <button class="btn" style="width:100%;margin-top:24px">Create here</button>
  </aside>
  <div class="card" style="position:relative;overflow:hidden;border-radius:32px;background:#072E1B">
    <div style="position:absolute;inset:80px;border:1px solid rgba(52,211,153,.22);border-radius:50%"></div>
    <div style="position:absolute;inset:180px;border:1px solid rgba(52,211,153,.28);border-radius:50%"></div>
    <div style="position:absolute;inset:280px;border:1px solid rgba(52,211,153,.35);border-radius:50%"></div>
    <div style="position:absolute;left:58%;top:18%;transform:translate(-50%,-50%);background:#34D399;color:#062012;border-radius:999px;padding:13px 17px;font-weight:950;box-shadow:0 20px 80px rgba(0,0,0,.24)">Push-up</div> <div style="position:absolute;left:68%;top:52%;transform:translate(-50%,-50%);background:#38BDF8;color:#062012;border-radius:999px;padding:13px 17px;font-weight:950;box-shadow:0 20px 80px rgba(0,0,0,.24)">Trivia</div> <div style="position:absolute;left:35%;top:62%;transform:translate(-50%,-50%);background:#FB923C;color:#062012;border-radius:999px;padding:13px 17px;font-weight:950;box-shadow:0 20px 80px rgba(0,0,0,.24)">Plank</div> <div style="position:absolute;left:48%;top:39%;transform:translate(-50%,-50%);background:#fff;color:#062012;border-radius:999px;padding:13px 17px;font-weight:950;box-shadow:0 20px 80px rgba(0,0,0,.24)">You</div>
    <div class="glass" style="position:absolute;left:40px;right:40px;bottom:34px;border-radius:24px;padding:16px;display:flex;justify-content:space-between;align-items:center"><b>Say: make a challenge here</b><button class="btn">Speak</button></div>
  </div>
</section><div style="position:absolute;right:38px;bottom:24px;color:#94A3B8;font-size:12px;font-weight:800">Map/radar is the homepage.</div></main></body></html>
