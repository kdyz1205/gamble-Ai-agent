<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111827;color:#F8FAFC;}
.screen{width:1440px;height:900px;overflow:hidden;position:relative;padding:36px 44px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:950;letter-spacing:.16em;text-transform:uppercase;font-size:12px}.logo{width:38px;height:38px;border-radius:13px;background:#34D399;color:#07110C;display:grid;place-items:center;font-weight:1000}.tag{font-size:12px;color:#64748B;font-weight:800}.pill{border:1px solid rgba(148, 163, 184, .26);border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.72);font-weight:850}
h1{font-size:58px;letter-spacing:-.052em;line-height:.96;margin:0}.thesis{font-size:18px;line-height:1.45;color:#64748B;font-weight:700;max-width:760px;margin:12px 0 0}
.glass{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);box-shadow:0 28px 90px rgba(15,23,42,.10);backdrop-filter:blur(22px)}.card{border:1px solid rgba(148, 163, 184, .26);background:#fff;border-radius:24px;box-shadow:0 20px 70px rgba(15,23,42,.08)}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#059669;font-weight:950}.muted{color:#64748B}.btn{border:0;border-radius:999px;background:#34D399;color:#052E1A;padding:13px 20px;font-weight:950}.btn2{border:1px solid rgba(148, 163, 184, .26);border-radius:999px;background:#fff;color:#111827;padding:12px 18px;font-weight:900}

</style></head><body><main class="screen"><div class="top"><div class="brand"><div class="logo">A</div><span>Axelrod</span></div><div class="tag">05 Battle Room</div></div>
<section style="height:760px;display:grid;grid-template-columns:1fr 120px 1fr;gap:18px;align-items:stretch">
  <div class="card" style="background:#172033;color:#fff;padding:26px;border-color:rgba(255,255,255,.12)">
    <div class="label">Creator / left</div><h1 style="font-size:58px">Kevin</h1>
    <div style="height:440px;border-radius:28px;background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.35);display:grid;place-items:center;font-size:24px;font-weight:900">Camera zone</div>
  </div>
  <div style="display:grid;place-items:center"><div style="width:92px;height:92px;border-radius:999px;background:#fff;color:#111827;display:grid;place-items:center;font-size:28px;font-weight:1000">VS</div></div>
  <div class="card" style="background:#172033;color:#fff;padding:26px;border-color:rgba(255,255,255,.12)">
    <div class="label">Opponent / right</div><h1 style="font-size:58px">Jerry</h1>
    <div style="height:440px;border-radius:28px;background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.35);display:grid;place-items:center;font-size:24px;font-weight:900">Camera zone</div>
  </div>
  <div class="glass" style="position:absolute;left:350px;right:350px;bottom:38px;border-radius:24px;padding:18px;display:flex;justify-content:space-between;align-items:center;color:#111827"><b>Identity locked. Record same-camera proof.</b><button class="btn">Start</button></div>
</section><div style="position:absolute;right:38px;bottom:24px;color:#94A3B8;font-size:12px;font-weight:800">A room that makes who-is-who impossible to miss.</div></main></body></html>
