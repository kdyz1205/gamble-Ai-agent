<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0B1018;color:#F8FAFC;}
.screen{width:1440px;height:900px;overflow:hidden;position:relative;padding:36px 44px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:950;letter-spacing:.16em;text-transform:uppercase;font-size:12px}.logo{width:38px;height:38px;border-radius:13px;background:#34D399;color:#07110C;display:grid;place-items:center;font-weight:1000}.tag{font-size:12px;color:#64748B;font-weight:800}.pill{border:1px solid rgba(148, 163, 184, .26);border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.72);font-weight:850}
h1{font-size:58px;letter-spacing:-.052em;line-height:.96;margin:0}.thesis{font-size:18px;line-height:1.45;color:#64748B;font-weight:700;max-width:760px;margin:12px 0 0}
.glass{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);box-shadow:0 28px 90px rgba(15,23,42,.10);backdrop-filter:blur(22px)}.card{border:1px solid rgba(148, 163, 184, .26);background:#fff;border-radius:24px;box-shadow:0 20px 70px rgba(15,23,42,.08)}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#059669;font-weight:950}.muted{color:#64748B}.btn{border:0;border-radius:999px;background:#34D399;color:#052E1A;padding:13px 20px;font-weight:950}.btn2{border:1px solid rgba(148, 163, 184, .26);border-radius:999px;background:#fff;color:#111827;padding:12px 18px;font-weight:900}

</style></head><body><main class="screen"><div class="top"><div class="brand"><div class="logo">A</div><span>Axelrod</span></div><div class="tag">03 Camera First</div></div>
<section style="display:grid;grid-template-columns:1fr 420px;gap:28px;height:760px">
  <div style="border-radius:34px;background:#111827;border:1px solid rgba(255,255,255,.12);position:relative;overflow:hidden">
    <div style="position:absolute;inset:28px;border:2px dashed rgba(255,255,255,.24);border-radius:28px"></div>
    <div style="position:absolute;left:70px;top:95px;width:240px;height:520px;border-radius:120px 120px 40px 40px;background:rgba(52,211,153,.20);border:1px solid rgba(52,211,153,.5)"></div>
    <div style="position:absolute;right:70px;top:95px;width:240px;height:520px;border-radius:120px 120px 40px 40px;background:rgba(56,189,248,.18);border:1px solid rgba(56,189,248,.45)"></div>
    <div style="position:absolute;left:92px;top:52px" class="pill">Creator left</div><div style="position:absolute;right:92px;top:52px" class="pill">Jerry right</div>
    <div style="position:absolute;left:50%;bottom:42px;transform:translateX(-50%);display:flex;gap:14px"><button class="btn">Record</button><button class="btn2">Upload</button></div>
  </div>
  <aside class="card" style="padding:24px;background:#F8FAFC;color:#111827">
    <div class="label">Identity sentence</div>
    <h1 style="font-size:42px;margin:12px 0">One line, no codes.</h1>
    <p class="thesis">“I am Kevin on the left. Jerry is on the right. Axelrod start.”</p>
    <div style="display:grid;gap:10px;margin-top:18px"><div style="display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(148, 163, 184, .26);border-radius:16px;padding:13px 14px;background:rgba(248,250,252,.7)"><b>full body visible</b><span style="color:#34D399;font-weight:950">✓</span></div><div style="display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(148, 163, 184, .26);border-radius:16px;padding:13px 14px;background:rgba(248,250,252,.7)"><b>no cuts</b><span style="color:#34D399;font-weight:950">✓</span></div><div style="display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(148, 163, 184, .26);border-radius:16px;padding:13px 14px;background:rgba(248,250,252,.7)"><b>say names</b><span style="color:#34D399;font-weight:950">✓</span></div><div style="display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(148, 163, 184, .26);border-radius:16px;padding:13px 14px;background:rgba(248,250,252,.7)"><b>show timer</b><span style="color:#34D399;font-weight:950">✓</span></div><div style="display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(148, 163, 184, .26);border-radius:16px;padding:13px 14px;background:rgba(248,250,252,.7)"><b>AI review</b><span style="color:#34D399;font-weight:950">✓</span></div></div>
  </aside>
</section><div style="position:absolute;right:38px;bottom:24px;color:#94A3B8;font-size:12px;font-weight:800">The product starts where proof starts.</div></main></body></html>
