<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Summon World</title>
    <style>
      :root {
        color-scheme: light;
        background: #eef9ff;
        color: #17324d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 218, 76, 0.72), transparent 25%),
          radial-gradient(circle at 82% 18%, rgba(112, 219, 255, 0.7), transparent 27%),
          linear-gradient(180deg, #f9fdff 0%, #dff5ff 52%, #f6ffe9 100%);
      }

      main {
        width: min(320px, 100%);
        text-align: center;
      }

      .familiar {
        position: relative;
        width: 104px;
        height: 104px;
        margin: 0 auto 22px;
        border: 5px solid #17324d;
        border-radius: 48% 52% 46% 54%;
        background: linear-gradient(145deg, #ffe45f, #ffbd45);
        box-shadow: 0 14px 0 rgba(23, 50, 77, 0.13), 0 24px 44px rgba(45, 126, 171, 0.18);
        transform: rotate(-3deg);
      }

      .familiar::before,
      .familiar::after {
        content: "";
        position: absolute;
        top: 35px;
        width: 12px;
        height: 16px;
        border-radius: 50%;
        background: #17324d;
      }

      .familiar::before {
        left: 25px;
      }

      .familiar::after {
        right: 25px;
      }

      .spark {
        position: absolute;
        right: -13px;
        top: -12px;
        width: 33px;
        height: 33px;
        border: 4px solid #17324d;
        border-radius: 50%;
        background: #70dbff;
      }

      .smile {
        position: absolute;
        left: 38px;
        top: 58px;
        width: 23px;
        height: 12px;
        border: 4px solid #17324d;
        border-top: 0;
        border-radius: 0 0 18px 18px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 30px;
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: #506b82;
        font-size: 15px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="familiar" aria-hidden="true">
        <span class="spark"></span>
        <span class="smile"></span>
      </div>
      <h1>Summon World</h1>
      <p>Your Familiar is opening the Quest portal. Check your connection if this screen stays visible.</p>
    </main>
  </body>
</html>
