name: Production Agent Protocol Chain E2E

on:
  workflow_dispatch:
  schedule:
    # Weekly because this exercises real production auth, agent LLM calls, and evidence writes.
    - cron: "47 12 * * 3"

concurrency:
  group: production-agent-protocol-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent-protocol-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://stubborn-ai.vercel.app
      E2E_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Install browser for UI E2E
        run: npx playwright install --with-deps chromium
      - name: Prove public click/navigation flow
        run: npm run e2e:click-flow
      - name: Prove rule safety prefilter
        run: npm run e2e:rule-safety-production
      - name: Prove challenge manager close/cancel/refund flow
        run: npm run e2e:manage-flow
      - name: Prove challenge archive/restore flow
        run: npm run e2e:archive-flow
      - name: Prove challenge discovery filters
        run: npm run e2e:discovery-filters
      - name: Prove GPS location gate settlement
        run: npm run e2e:gps-checkin-settlement
      - name: Prove data-source oracle settlement
        run: npm run e2e:data-source-oracle-settlement
      - name: Prove compiler intent matrix
        run: npm run e2e:protocol-compile-matrix
      - name: Prove agent compile-to-publish chain
        run: npm run e2e:agent-compile-publish
      - name: Prove agent protocol-chain tools
        run: npm run e2e:agent-tool-guardrails
      - name: Prove agent judge-to-settlement chain
        run: npm run e2e:agent-settlement-chain
      - name: Prove single-challenge agent golden path
        run: npm run e2e:agent-golden-path
      - name: Prove agent review/no-settlement path
        run: npm run e2e:agent-review-path
      - name: Prove rejudge escalation path
        run: npm run e2e:rejudge-verdict
      - name: Prove manual review resolution path
        run: npm run e2e:manual-review-resolution
      - name: Prove solo challenge path
        run: npm run e2e:solo-flow
