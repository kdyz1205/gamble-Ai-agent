name: iOS Native Verification and Export

on:
  pull_request:
    paths:
      - "ios/**"
      - "ios-shell/**"
      - "src/components/ios/**"
      - "src/app/app/**"
      - "src/app/ios-app.css"
      - "src/app/layout.tsx"
      - "src/components/QuestAppNav.tsx"
      - "capacitor.config.ts"
      - "app-store/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-release.yml"
  workflow_dispatch:
    inputs:
      app_target:
        description: 'Signed beta points at an authorized Vercel preview or the production /app'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production
      preview_url:
        description: 'Full HTTPS Vercel preview URL ending in /app, only for preview beta'
        required: false
        type: string

permissions:
  contents: read

jobs:
  unsigned-ios-archive:
    name: Build actual unsigned iOS app archive
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify native bundle before signing
        run: |
          node scripts/test-ios-xcodeproj-integrity.cjs
          test -f ios-shell/index.html
          test -f ios-shell/pico-offline.webp
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          npm run ios:sync
          npm run ios:doctor
          test -f ios/App/App/public/index.html
          cmp ios-shell/index.html ios/App/App/public/index.html
          cmp ios-shell/pico-offline.webp ios/App/App/public/pico-offline.webp
      - name: Compile unsigned iOS Release archive
        run: npm run ios:archive:unsigned
      - name: Verify archived app bundle exists
        shell: bash
        run: |
          set -euo pipefail
          archive="ios/build/SummonWorld-Unsigned.xcarchive"
          test -d "$archive/Products/Applications"
          app=$(find "$archive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist"
          test -f "$app/public/index.html" || test -f "$app/public/index.html.gz"
          echo "UNSIGNED_IOS_ARCHIVE_VERIFIED: $app"
      - uses: actions/upload-artifact@v4
        with:
          name: SummonWorld-Unsigned-iOS-Archive
          path: ios/build/SummonWorld-Unsigned.xcarchive
          retention-days: 7
          if-no-files-found: error

  signed-app-store-export:
    name: Signed iOS export for TestFlight review
    runs-on: macos-15
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    env:
      SUM_IOS_TARGET: ${{ inputs.app_target }}
      SUM_IOS_APP_URL: ${{ inputs.app_target == 'preview' && inputs.preview_url || 'https://summoner.world/app' }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Require Apple signing authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_API_KEY_BASE64" || { echo 'Missing App Store Connect signing credential'; exit 1; }
          test -n "$APP_STORE_CONNECT_KEY_ID" || { echo 'Missing App Store Connect key ID'; exit 1; }
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || { echo 'Missing App Store Connect issuer ID'; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo 'Missing Apple Developer team ID'; exit 1; }
      - name: Gate signed export on a working authorized App route
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ios-verify-target.cjs
          curl --fail --silent --show-error --location --max-time 20 -o /dev/null "${SUM_IOS_APP_URL%/}/today"
          echo 'IOS_APP_TARGET_HTTP_VERIFIED'
      - name: Select App Store supported Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          matching=(/Applications/Xcode_26*.app)
          test -d "${matching[0]}" || { echo 'Xcode 26 is required for App Store uploads'; exit 1; }
          sudo xcode-select --switch "${matching[0]}/Contents/Developer"
          xcodebuild -version | grep 'Xcode 26'
      - name: Install and sync native App
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/test-ios-xcodeproj-integrity.cjs
          if [[ "$SUM_IOS_TARGET" == 'preview' ]]; then
            PREVIEW_HOST=$(node -p 'new URL(process.env.SUM_IOS_APP_URL).hostname')
            /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:1 string $PREVIEW_HOST" ios/App/App/Info.plist
          fi
          npm run ios:sync
          node -e 'const x=require("./ios/App/App/capacitor.config.json");if(x.server?.url!==process.env.SUM_IOS_APP_URL)process.exit(1)'
          npm run ios:doctor
          npm run ios:doctor
      - name: Install App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/build/private_keys
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "ios/build/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "ios/build/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
      - name: Build signed archive
        shell: bash
        run: |
          npm run ios:archive -- \
            -allowProvisioningUpdates \
            -authenticationKeyPath "ios/build/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
      - name: Export signed App Store/TestFlight IPA
        shell: bash
        run: |
          npm run ios:export -- \
            -allowProvisioningUpdates \
            -authenticationKeyPath "ios/build/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          find ios/build/AppStore -name '*.ipa' | grep -q .
      - name: Upload signed build to App Store Connect for TestFlight processing
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find ios/build/AppStore -maxdepth 2 -type f -name '*.ipa' -print -quit)
          test -n "$IPA"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          install -m 600 "ios/build/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo 'APP_STORE_CONNECT_BINARY_UPLOADED_FOR_PROCESSING'
      - uses: actions/upload-artifact@v4
        with:
          name: SummonWorld-Signed-AppStore-Export
          path: ios/build/AppStore/*.ipa
          retention-days: 7
          if-no-files-found: error

  simulator-smoke:
    name: Boot real iPhone Simulator and capture SUM App
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SUM_IOS_TARGET: preview
      SUM_IOS_APP_URL: https://stubborn-git-integrate-summoner-ios-f-3efa54-kdyz1205s-projects.vercel.app/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install and validate hosted App source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/ios-verify-target.cjs
          curl --fail --silent --show-error --location --max-time 20 -o /dev/null "${SUM_IOS_APP_URL}/today"
          node scripts/test-ios-xcodeproj-integrity.cjs
      - name: Select a real, available iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/ios-devices.json"
          python3 - <<'PY'
          import json,os,sys
          data=json.load(open(os.environ["RUNNER_TEMP"]+"/ios-devices.json",encoding="utf-8"))
          ios=[(runtime,device) for runtime,devices in data["devices"].items()
               if "iOS" in runtime for device in devices
               if device.get("isAvailable",False) and "iPhone" in device["name"]]
          if not ios:
              print("NO_AVAILABLE_IPHONE_SIMULATOR",file=sys.stderr)
              sys.exit(1)
          runtime,device=ios[-1]
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as out:
              out.write("IOS_SIMULATOR_UDID="+device["udid"]+"\n")
          print("SELECTED_SIMULATOR",runtime,device["name"],device["udid"])
          PY
      - name: Build actual native iOS Simulator executable
        shell: bash
        run: |
          set -euo pipefail
          preview_host=$(node -p 'new URL(process.env.SUM_IOS_APP_URL).hostname')
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:1 string $preview_host" ios/App/App/Info.plist
          npm run ios:sync
          node -e 'const c=require("./ios/App/App/capacitor.config.json");if(c.server?.url!==process.env.SUM_IOS_APP_URL)process.exit(1)'
          mkdir -p ios/build/simulator-evidence
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/simulator-derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            > ios/build/simulator-evidence/xcodebuild.log 2>&1 || {
              tail -n 120 ios/build/simulator-evidence/xcodebuild.log
              exit 1
            }
      - name: Boot, install, launch and screenshot iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          sim="$IOS_SIMULATOR_UDID"
          app="ios/build/simulator-derived/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$app"
          xcrun simctl boot "$sim"
          # Do not let a stalled macOS CoreSimulator hide a failure for 45 minutes.
          python3 - "$sim" <<'PY'
          import subprocess,sys
          cmd=["xcrun","simctl","bootstatus",sys.argv[1],"-b"]
          try:
              subprocess.run(cmd,check=True,timeout=240)
          except subprocess.TimeoutExpired:
              print("IOS_SIMULATOR_BOOT_TIMEOUT_AFTER_240_SECONDS",file=sys.stderr)
              sys.exit(124)
          PY
          xcrun simctl list devices available > ios/build/simulator-evidence/simulators.txt
          xcrun simctl install "$sim" "$app"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          test "$bundle" = "com.summonworld.app"
          xcrun simctl launch "$sim" "$bundle" | tee ios/build/simulator-evidence/launch.log
          sleep 15
          xcrun simctl io "$sim" screenshot ios/build/simulator-evidence/iphone-app.png
          sips -g pixelWidth -g pixelHeight ios/build/simulator-evidence/iphone-app.png
          test -s ios/build/simulator-evidence/iphone-app.png
          echo "IOS_SIMULATOR_NATIVE_LAUNCH_AND_SCREENSHOT_VERIFIED"
      - name: Keep the actual simulator evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SummonWorld-iPhone-Simulator-Smoke
          path: ios/build/simulator-evidence/
          retention-days: 7
          if-no-files-found: warn
