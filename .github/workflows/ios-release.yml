name: iOS Release Verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "ios-shell/**"
      - "src/app/enter/**"
      - "src/app/summons/**"
      - "src/app/privacy/**"
      - "src/app/terms/**"
      - "src/app/support/**"
      - "src/components/gateway/**"
      - "src/components/summons/**"
      - "src/components/legal/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-release.yml"

jobs:
  ios-unsigned-archive:
    name: Validate native iOS archive
    runs-on: macos-15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_challengeai?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long
      NEXTAUTH_URL: https://summoner.world

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - run: npm run ios:sync

      - run: npm run ios:doctor

      - run: npm run ios:archive:unsigned

      - uses: actions/upload-artifact@v4
        with:
          name: SummonWorld-Unsigned-iOS-Archive
          path: ios/build/SummonWorld-Unsigned.xcarchive
          if-no-files-found: error

  app-store-connect-export:
    name: App Store Connect signed export
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch'
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_challengeai?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long
      NEXTAUTH_URL: https://summoner.world
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - run: npm run ios:sync

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          test -n "$APP_STORE_CONNECT_API_KEY_BASE64"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          mkdir -p ios/build/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "ios/build/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Archive signed App Store build
        shell: bash
        run: |
          npm run ios:archive -- \
            -allowProvisioningUpdates \
            -authenticationKeyPath "ios/build/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export app-store-connect archive
        shell: bash
        run: |
          npm run ios:export -- \
            -allowProvisioningUpdates \
            -authenticationKeyPath "ios/build/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: SummonWorld-AppStoreConnect-Export
          path: ios/build/AppStore
          if-no-files-found: error
