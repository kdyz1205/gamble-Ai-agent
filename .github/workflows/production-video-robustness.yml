name: Production Video Robustness E2E

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Comma-separated robustness cases to run"
        required: false
        default: "clean_a_beats_b,static_loop,no_visible_role_label"
  schedule:
    # Paid OpenAI vision robustness suite against production. Weekly to control cost.
    - cron: "47 11 * * 1"

jobs:
  video-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Prove production video robustness gates
        env:
          E2E_BASE_URL: https://gamble-ai-agent.vercel.app
          E2E_JUDGE_PROVIDER: openai
          E2E_JUDGE_MODEL: gpt-4o
          E2E_COMMIT_SHA: ${{ github.sha }}
          RUN_ROBUSTNESS_CASES: ${{ github.event.inputs.cases || 'clean_a_beats_b,static_loop,no_visible_role_label' }}
        run: node scripts/e2e-real-video-robustness.mjs
