name: CI

on:
  push:
    branches: [main, codex/summoner-current-site, fix/sum-production-fullstack-20261027]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: summoner_verification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/summoner_verification?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
      VERIFIED_QUIZ_ENABLED: "true" # CI-only isolated migrated PostgreSQL, never production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Verify reviewed dependency graph and runtime compatibility
        run: |
          node scripts/test-dependency-policy.cjs
          node scripts/test-dependency-runtime.cjs
          mkdir -p output/security
          npm audit --audit-level=low --json > output/security/dependency-audit.json

      - run: npx tsx scripts/test-evidence-receipt.ts

      - run: npx tsx scripts/test-composer-owner.ts
      - run: npx tsx scripts/test-composer-input-memory.ts
      - run: npx tsx scripts/test-quest-navigation-context.ts
      - run: npx tsx scripts/test-proof-interface-copy.ts

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: node scripts/test-ios-clean-art.cjs

      - run: node scripts/test-ios-pr-preview.cjs

      - run: node scripts/test-ios-visual-gallery.cjs

      - run: npm run test:production:unit

      - run: npm run test:production:integration

      - run: npx next build

      - run: npx playwright install --with-deps chromium

      - name: Verify real browser creation and cancellation against production build
        env:
          AI_ENABLED: "false"
          TEST_BASE_URL: http://localhost:3000
        run: |
          npm run start > /tmp/summoner-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node -e 'let n=0; (async function check(){try{const r=await fetch("http://localhost:3000/api/auth/session");if(r.ok)return}catch{}if(++n>=60)process.exit(1);setTimeout(check,1000)})()'
          npx playwright test tests/e2e-gambles/journey-context-regressions.spec.ts tests/e2e-gambles/proof-interface-regressions.spec.ts --workers=1 --output=output/journey-proof-tests --reporter=list
          node scripts/qa-journey-proof.cjs
          npx playwright test tests/e2e-gambles/voice-lifecycle-regressions.spec.ts tests/e2e-gambles/proof-camera-regressions.spec.ts --workers=1 --output=output/media-lifecycle-tests --reporter=list
          npx playwright test tests/e2e-gambles/session-proof-boundaries.spec.ts --workers=1 --output=output/session-proof-tests --reporter=list
          npx playwright test tests/e2e-gambles/composer-input-continuity.spec.ts tests/e2e-gambles/app-scroll-target-regressions.spec.ts --workers=1 --output=output/composer-input-continuity --reporter=list
          npx playwright test tests/e2e-gambles/composer-ux-regressions.spec.ts tests/e2e-gambles/navigation-ux-regressions.spec.ts --workers=1 --output=output/composer-nav-tests --reporter=list
          node scripts/qa-composer-navigation.cjs
          npx playwright test tests/e2e-gambles/desktop-locale-regressions.spec.ts --workers=1 --output=output/desktop-locale-tests --reporter=list
          node scripts/qa-desktop-language.cjs
          npx playwright test tests/e2e-gambles/visual-p1-regressions.spec.ts tests/e2e-gambles/community-p1-regressions.spec.ts --workers=1
          npm run test:production:http
          SUM_IOS_URL=http://localhost:3000 SUM_IOS_QUICK=1 node scripts/qa-ios-full-app.cjs
          SUM_IOS_URL=http://localhost:3000 node scripts/qa-app-vs-landing.cjs
          node scripts/build-ios-visual-gallery.cjs
          npx playwright test tests/e2e-gambles/composer-conversation.spec.ts tests/e2e-gambles/quest-cancellation.spec.ts tests/e2e-gambles/quest-browser-lifecycle.spec.ts tests/e2e-gambles/positive-stake-journey.spec.ts tests/e2e-gambles/evidence-ui-contract.spec.ts tests/e2e-gambles/review-browser-lifecycle.spec.ts tests/e2e-gambles/verified-voice-quiz-duel.spec.ts tests/e2e-gambles/app-quest-journey.spec.ts tests/e2e-gambles/pico-3d-opt-in.spec.ts tests/e2e-gambles/pico-story-chapter.spec.ts tests/e2e-gambles/auth-registration.spec.ts tests/e2e-gambles/auth-brand-consistency.spec.ts tests/e2e-gambles/fullstack-auth-regressions.spec.ts tests/e2e-gambles/fullstack-frontend-regressions.spec.ts tests/e2e-gambles/fullstack-input-boundaries.spec.ts tests/e2e-gambles/fullstack-support-regressions.spec.ts --workers=1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-flow-evidence
          path: |
            playwright-report
            output/ios-full-app
            output/desktop-locale-tests
            output/composer-nav-tests
            output/composer-input-continuity
            output/composer-navigation
            output/session-proof-tests
            output/media-lifecycle-tests
            output/journey-proof-tests
            output/journey-proof
            output/security
            output/desktop-language
            tests/e2e-gambles/.playwright
            /tmp/summoner-browser-server.log
          if-no-files-found: ignore
