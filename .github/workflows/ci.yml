name: CI

on:
  push:
    branches: [main, codex/summoner-current-site]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: summoner_verification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/summoner_verification?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
      VERIFIED_QUIZ_ENABLED: "true" # CI-only isolated migrated PostgreSQL, never production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: node scripts/test-ios-clean-art.cjs

      - run: node scripts/test-ios-pr-preview.cjs

      - run: node scripts/test-ios-visual-gallery.cjs

      - run: npm run test:production:unit

      - run: npm run test:production:integration

      - run: npx next build

      - run: npx playwright install --with-deps chromium

      - name: Verify real browser creation and cancellation against production build
        env:
          AI_ENABLED: "false"
          TEST_BASE_URL: http://localhost:3000
        run: |
          npm run start > /tmp/summoner-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node -e 'let n=0; (async function check(){try{const r=await fetch("http://localhost:3000/api/auth/session");if(r.ok)return}catch{}if(++n>=60)process.exit(1);setTimeout(check,1000)})()'
          npm run test:production:http
          SUM_IOS_URL=http://localhost:3000 SUM_IOS_QUICK=1 node scripts/qa-ios-full-app.cjs
          node scripts/build-ios-visual-gallery.cjs
          npx playwright test tests/e2e-gambles/composer-conversation.spec.ts tests/e2e-gambles/quest-cancellation.spec.ts tests/e2e-gambles/quest-browser-lifecycle.spec.ts tests/e2e-gambles/positive-stake-journey.spec.ts tests/e2e-gambles/evidence-ui-contract.spec.ts tests/e2e-gambles/review-browser-lifecycle.spec.ts tests/e2e-gambles/verified-voice-quiz-duel.spec.ts --workers=1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-flow-evidence
          path: |
            playwright-report
            output/ios-full-app
            tests/e2e-gambles/.playwright
            /tmp/summoner-browser-server.log
          if-no-files-found: ignore
