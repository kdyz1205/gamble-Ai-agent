name: CI

on:
  push:
    branches: [main, codex/summoner-current-site]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: summoner_verification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/summoner_verification?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
      VERIFIED_QUIZ_ENABLED: "true" # CI-only isolated migrated PostgreSQL, never production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run test:trusted-evidence:smoke

      - run: npx tsc --noEmit

      - run: node scripts/test-ios-clean-art.cjs

      - run: node scripts/test-ios-pr-preview.cjs

      - run: node scripts/test-ios-visual-gallery.cjs

      - run: npm run test:production:unit

      - run: npm run test:production:integration

      - run: npx next build

      - run: npx playwright install --with-deps chromium

      - name: Verify real browser creation and cancellation against production build
        env:
          AI_ENABLED: "false"
          TEST_BASE_URL: http://localhost:3000
        run: |
          npm run start > /tmp/summoner-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node -e 'let n=0; (async function check(){try{const r=await fetch("http://localhost:3000/api/auth/session");if(r.ok)return}catch{}if(++n>=60)process.exit(1);setTimeout(check,1000)})()'
          npm run test:production:http
          SUM_IOS_URL=http://localhost:3000 SUM_IOS_QUICK=1 node scripts/qa-ios-full-app.cjs
          SUM_IOS_URL=http://localhost:3000 node scripts/qa-app-vs-landing.cjs
          node scripts/build-ios-visual-gallery.cjs
          npx playwright test tests/e2e-gambles/composer-conversation.spec.ts tests/e2e-gambles/quest-cancellation.spec.ts tests/e2e-gambles/quest-browser-lifecycle.spec.ts tests/e2e-gambles/positive-stake-journey.spec.ts tests/e2e-gambles/evidence-ui-contract.spec.ts tests/e2e-gambles/review-browser-lifecycle.spec.ts tests/e2e-gambles/verified-voice-quiz-duel.spec.ts tests/e2e-gambles/app-quest-journey.spec.ts --workers=1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-flow-evidence
          path: |
            playwright-report
            output/ios-full-app
            tests/e2e-gambles/.playwright
            /tmp/summoner-browser-server.log
          if-no-files-found: ignore

  trusted-storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: summoner_verification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/summoner_verification?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long
      NEXTAUTH_URL: http://127.0.0.1:3000
      TEST_BASE_URL: http://127.0.0.1:3000
      ENABLE_TRUSTED_EVIDENCE_UPLOADS: "true"
      TRUSTED_EVIDENCE_REQUIRED_FOR_MEDIA: "true"
      AI_ENABLED: "false"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      S3_TRUSTED_EVIDENCE_BUCKET: ci-private-evidence
      S3_EVIDENCE_BUCKET: legacy-public-evidence
      S3_TRUSTED_EVIDENCE_ENDPOINT: http://127.0.0.1:9000
      S3_TRUSTED_EVIDENCE_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Start ephemeral S3-compatible bucket
        run: |
          docker run -d --rm --name trusted-storage-ci -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:RELEASE.2026-10-18T00-00-00Z server /data
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs trusted-storage-ci
          exit 1
      - name: Signed private upload and server-side digest
        run: npx tsx scripts/e2e-trusted-evidence-storage.ts

      - name: Install disposable PostgreSQL schema
        run: npx prisma migrate deploy

      - name: Exercise private MP4 submission from two authenticated accounts
        run: |
          ffmpeg -version | head -n 1
          npm run build > /tmp/summoner-trusted-build.log 2>&1 || {
            tail -n 120 /tmp/summoner-trusted-build.log
            exit 1
          }
          npm run start > /tmp/summoner-trusted-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node -e 'let n=0;(async function ready(){try{const r=await fetch("http://127.0.0.1:3000/api/auth/session");if(r.ok)return}catch{}if(++n>=90)process.exit(1);setTimeout(ready,1000)})()'
          npx tsx scripts/e2e-trusted-evidence-journey.ts || {
            tail -n 120 /tmp/summoner-trusted-server.log
            exit 1
          }
