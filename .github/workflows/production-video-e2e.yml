name: Production Video E2E

on:
  workflow_dispatch:
  schedule:
    # Paid OpenAI vision regression against production. Keep low frequency.
    - cron: "17 11 * * *"

jobs:
  video-winner-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Prove production video winner settlement
        env:
          E2E_BASE_URL: https://gamble-ai-agent.vercel.app
          E2E_JUDGE_PROVIDER: openai
          E2E_JUDGE_MODEL: gpt-4o
          E2E_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/e2e-video-winner-settlement.mjs
